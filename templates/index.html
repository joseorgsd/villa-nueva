<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Villa Nueva | Dashboard</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Inter', system-ui; background-color: var(--bg); color: var(--text); padding: 40px; }
        .container { max-width: 900px; margin: auto; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .lead-grid { display: grid; gap: 15px; }
        .lead-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .btn-contact { background: var(--primary); color: white; padding: 10px 15px; border-radius: 6px; text-decoration: none; font-size: 14px; }
        .badge { background: #312e81; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard Villa Nueva</h1>
        <div class="stats">
            <div class="stat-card"><h3>Leads Activos</h3><p style="font-size: 24px; font-weight: bold;">{{ stats.total }}</p></div>
            <div class="stat-card"><h3>Valor Pipeline</h3><p style="font-size: 24px; font-weight: bold;">${{ stats.value }}</p></div>
        </div>
        
        <div class="lead-grid">
            {% for lead in leads %}
            <div class="lead-card">
                <div>
                    <strong>{{ lead.nombre }}</strong> <span class="badge">{{ lead.industria }}</span>
                    <p style="color: #94a3b8; font-size: 14px; margin: 5px 0;">{{ lead.necesidad_detectada }}</p>
                </div>
                <a href="#" class="btn-contact" onclick="contactLead({{ lead.id }})">Contactar Lead</a>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        async function contactLead(id) {
            const res = await fetch(`/api/email/${id}`);
            const data = await res.json();
            window.location.href = data.mailto;
        }
    </script>
</body>
</html>
